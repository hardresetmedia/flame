# CI for the Flame fork: install both packages, build the client, run the
# server API suite (vitest) and the Playwright smoke suite on Node 22 —
# matching the node:22-alpine production image.
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install server dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Build client into public/
        run: npm run build:client

      - name: Server API tests
        run: npm test

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: E2E smoke tests
        run: npm run test:e2e
